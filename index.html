<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1013">
<meta name="color-scheme" content="dark">
<title>FORJA — mapa de força</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1013; --bg2:#13161B; --panel:#191D23; --panel2:#1F242B;
  --line:#262B33; --line2:#343B45;
  --txt:#E9ECF1; --dim:#8B93A0; --dim2:#5D6673;
  --chalk:#F4F6F9; --chalk-ink:#0E1013;
  --t0:#6E7681; --t1:#C0763A; --t2:#B9C4D0; --t3:#E8B23A; --t4:#45D3C4; --t5:#8FC0FF;
  --nodata:#242A32;
  --ok:#45D3C4; --warn:#E8B23A; --bad:#E0664B;
  --r:14px;
  --pad:14px;
  --disp:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:var(--body); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
}
.wrap{max-width:520px;margin:0 auto;padding:0 var(--pad)}
h1,h2,h3,h4{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:0;line-height:1.05}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- topbar ---------- */
.top{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,var(--bg) 72%,rgba(14,16,19,0));
  padding:calc(10px + env(safe-area-inset-top)) 0 8px;
}
.top .wrap{display:flex;align-items:baseline;gap:9px}
.brand{font-family:var(--disp);font-size:23px;font-weight:700;letter-spacing:.14em}
.brand span{color:var(--dim2)}
.top .sub{font-family:var(--mono);font-size:10.5px;color:var(--dim2);letter-spacing:.1em;text-transform:uppercase;margin-left:auto}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.card.tight{padding:11px 12px}
.card.flat{background:transparent;border-color:var(--line)}
.ttl{font-family:var(--disp);font-size:13px;letter-spacing:.13em;color:var(--dim);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ttl:after{content:"";flex:1;height:1px;background:var(--line)}
.hint{font-size:12.5px;color:var(--dim);line-height:1.4}
.hint.mt{margin-top:9px}

/* ---------- rank header ---------- */
.rank{display:flex;align-items:flex-end;gap:12px}
.rank .name{font-family:var(--disp);font-size:44px;line-height:.86;letter-spacing:.01em}
.rank .div{font-family:var(--mono);font-size:15px;font-weight:600;opacity:.7;margin-left:7px}
.rank .idx{margin-left:auto;text-align:right;flex:none}
.rank .idx b{font-family:var(--mono);font-size:26px;font-weight:600;display:block;line-height:1}
.rank .idx i{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--dim2);letter-spacing:.12em;text-transform:uppercase}
.gauge{margin-top:13px}
.nextline{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:7px}

/* ---------- body map ---------- */
.figs{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:6px 4px 2px;margin-bottom:12px}
.figs svg{display:block;width:100%;height:auto}
.figs .lbls{display:flex;justify-content:space-around;font-family:var(--mono);font-size:10px;color:var(--dim2);letter-spacing:.14em;padding:0 0 7px}
.mz{cursor:pointer;transition:filter .16s}
.mz.sel{stroke:var(--chalk);stroke-width:2.2}

/* ---------- legend list ---------- */
.mlist{display:flex;flex-direction:column;gap:1px}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 2px;background:none;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;color:var(--txt);font:inherit;cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow .sw{width:9px;height:26px;border-radius:3px;flex:none}
.mrow .nm{flex:1;min-width:0}
.mrow .nm b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .nm s{text-decoration:none;display:block;font-family:var(--mono);font-size:10.5px;color:var(--dim2)}
.mrow .tg{font-family:var(--disp);font-size:14.5px;letter-spacing:.06em;text-align:right}
.mrow .tg u{text-decoration:none;font-family:var(--mono);font-size:10px;color:var(--dim2);display:block;letter-spacing:.06em}
.mrow .chev{color:var(--dim2);font-size:15px}

/* ---------- pills / badges ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:3px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--dim);text-transform:uppercase}
.pill.on{border-color:currentColor}
.tb{display:inline-block;font-family:var(--disp);font-size:12.5px;letter-spacing:.09em;padding:2px 8px;border-radius:6px;border:1px solid;text-transform:uppercase}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:46px;padding:0 16px;border-radius:11px;border:1px solid transparent;
  background:var(--chalk);color:var(--chalk-ink);
  font-family:var(--disp);font-size:16px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  cursor:pointer;width:100%;transition:transform .12s,opacity .12s
}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--txt);border-color:var(--line2)}
.btn.sm{min-height:38px;font-size:13.5px;padding:0 12px;border-radius:9px;width:auto}
.btn.danger{background:transparent;border-color:#4a2a24;color:var(--bad)}
.btn[disabled]{opacity:.4;pointer-events:none}
.row2{display:flex;gap:9px}
.row2 .btn{flex:1}

/* ---------- inputs ---------- */
label.f{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;color:var(--dim2);text-transform:uppercase;margin:0 0 6px}
input,select,textarea{
  width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;
  color:var(--txt);font-family:var(--body);font-size:16px;padding:11px 12px;min-height:46px;appearance:none
}
input.mono,.mono input{font-family:var(--mono)}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%238B93A0' stroke-width='1.6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:34px}
textarea{min-height:70px;font-size:15px;line-height:1.4}
input:focus,select:focus,textarea:focus,button:focus-visible,.mrow:focus-visible{outline:2px solid var(--t4);outline-offset:1px}
.fld{margin-bottom:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{display:flex;gap:7px;align-items:stretch}
.step input{text-align:center;flex:1;font-family:var(--mono);font-weight:600}
.step button{width:46px;flex:none;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;color:var(--txt);font-size:21px;font-family:var(--mono);cursor:pointer;line-height:1}
.step button:active{background:var(--line)}

/* ---------- chips ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:1px 0 3px;margin:0 0 11px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--panel2);border:1px solid var(--line2);border-radius:99px;padding:7px 12px;font-size:13px;color:var(--txt);cursor:pointer;white-space:nowrap;font-family:var(--body)}
.chip.on{background:var(--chalk);color:var(--chalk-ink);border-color:var(--chalk);font-weight:600}

/* ---------- set list ---------- */
.setrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .n{font-family:var(--mono);font-size:11px;color:var(--dim2);width:20px}
.setrow .d{flex:1;min-width:0}
.setrow .d b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setrow .d s{text-decoration:none;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.x{background:none;border:0;color:var(--dim2);font-size:19px;padding:6px 4px;cursor:pointer;line-height:1}

/* ---------- goal cards ---------- */
.goal{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;background:var(--panel)}
.goal .g1{display:flex;align-items:center;gap:8px}
.goal .g1 b{font-size:14.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal .g2{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:5px}
.goal .g2 em{font-style:normal;color:var(--txt);font-weight:600}
.bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px}

/* ---------- sheet ---------- */
.bd{position:fixed;inset:0;background:rgba(6,7,9,.72);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.bd.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;
  background:var(--panel);border-top:1px solid var(--line2);
  border-radius:18px 18px 0 0;padding:16px var(--pad) calc(20px + env(safe-area-inset-bottom));
  max-width:520px;margin:0 auto;max-height:82vh;overflow:auto;
  transform:translateY(101%);transition:transform .26s cubic-bezier(.2,.8,.2,1)
}
.sheet.on{transform:translateY(0)}
.sheet .grab{width:38px;height:4px;border-radius:9px;background:var(--line2);margin:-6px auto 13px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--dim)}
.kv b{font-family:var(--mono);font-weight:600}

/* ---------- tabbar ---------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:rgba(19,22,27,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom))
}
.tabs .wrap{display:flex;gap:2px;padding:0 6px}
.tab{flex:1;background:none;border:0;color:var(--dim2);display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;cursor:pointer;border-radius:10px}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab b{font-family:var(--disp);font-size:10.5px;letter-spacing:.09em;font-weight:600;text-transform:uppercase}
.tab.on{color:var(--txt)}

/* ---------- misc ---------- */
.view{display:none;padding-top:2px}
.view.on{display:block}
.toast{
  position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-140%);
  z-index:60;background:var(--chalk);color:var(--chalk-ink);
  padding:10px 15px;border-radius:11px;font-family:var(--disp);font-size:14.5px;letter-spacing:.06em;
  text-transform:uppercase;max-width:90vw;text-align:center;transition:transform .3s cubic-bezier(.2,.9,.2,1);
  box-shadow:0 10px 30px rgba(0,0,0,.5)
}
.toast.on{transform:translate(-50%,0)}
.empty{text-align:center;padding:26px 14px;color:var(--dim)}
.empty h3{font-size:19px;color:var(--txt);margin-bottom:6px}
.empty p{font-size:13.5px;margin:0 auto;max-width:270px}
.sess{border-bottom:1px solid var(--line);padding:11px 0}
.sess:last-child{border-bottom:0}
.sess .h{display:flex;align-items:center;gap:8px}
.sess .h b{font-family:var(--disp);font-size:16px;letter-spacing:.05em;flex:1}
.sess .l{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:4px;line-height:1.5}
.warnbox{border:1px solid #4a3a1e;background:rgba(232,178,58,.07);border-radius:11px;padding:10px 12px;font-size:13px;color:#E2C282}

/* ---------- calor do exercício ---------- */
.heat{display:flex;gap:12px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px;margin:0 0 11px}
.heat .hfig{width:44%;max-width:158px;flex:none}
.heat .hfig svg{display:block;width:100%;height:auto}
.heat .hlist{flex:1;min-width:0}
.hrow{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.hrow .hn{font-size:12px;width:40%;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .hb{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.hrow .hb i{display:block;height:100%;border-radius:99px}
.hrow .hp{font-size:10.5px;color:var(--dim2);width:20px;text-align:right}
.hleg{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;font-family:var(--mono);font-size:9.5px;color:var(--dim2);text-transform:uppercase;letter-spacing:.05em}
.hleg span{display:inline-flex;align-items:center;gap:4px}
.hleg i{width:8px;height:8px;border-radius:2px}

/* ---------- evolução ---------- */
.stats{display:flex;gap:8px;margin-top:12px;border-top:1px solid var(--line);padding-top:11px}
.stats div{flex:1;text-align:center}
.stats b{font-size:21px;font-weight:600;display:block;line-height:1.1}
.stats s{text-decoration:none;font-family:var(--mono);font-size:9.5px;color:var(--dim2);text-transform:uppercase;letter-spacing:.05em;display:block}
.prline{padding:7px 0;border-bottom:1px solid var(--line)}
.prline:last-child{border-bottom:0}
.prline b{font-size:13.5px;font-weight:600;display:block}
.prline s{text-decoration:none;font-size:11.5px;color:var(--dim)}

/* ---------- selos ---------- */
.selos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.selo{border:1px solid var(--line);border-radius:11px;padding:9px 10px;background:var(--bg2)}
.selo b{font-family:var(--disp);font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);display:block}
.selo s{text-decoration:none;font-size:11px;color:var(--dim2);display:block;line-height:1.3;margin:3px 0 6px}
.selo .mono{font-size:9.5px;color:var(--dim2);text-transform:uppercase;letter-spacing:.06em}
.selo .bar{margin:0 0 4px}
.selo .bar i{background:var(--dim2)}
.selo.ok{border-color:#5c4a1e;background:linear-gradient(160deg,rgba(232,178,58,.13),rgba(232,178,58,.03))}
.selo.ok b{color:var(--t3)}
.selo.ok s{color:#B79A63}
.selo.ok .mono{color:var(--t3)}

/* ---------- duelo ---------- */
.duel{display:flex;align-items:flex-start;gap:8px}
.duel .dl{flex:1;min-width:0}
.duel .dl.r{text-align:right}
.duel .dl i{display:block;width:22px;height:3px;border-radius:9px;margin-bottom:7px}
.duel .dl.r i{margin-left:auto}
.duel .dl s{text-decoration:none;font-size:12.5px;color:var(--dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duel .dl b{font-size:27px;font-weight:600;display:block;line-height:1.05}
.duel .dl u{text-decoration:none;font-family:var(--disp);font-size:13px;letter-spacing:.07em;text-transform:uppercase}
.duel .dvs{font-family:var(--disp);font-size:19px;color:var(--dim2);padding-top:22px}
.placar{text-align:center;font-family:var(--disp);font-size:31px;letter-spacing:.04em;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.cmp{padding:8px 0;border-bottom:1px solid var(--line)}
.cmp:last-child{border-bottom:0}
.cmp .c1{display:flex;align-items:baseline;gap:8px}
.cmp .c1 b{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp .c1 span{font-size:11.5px}
.cmp .c2{font-size:11px;color:var(--dim);text-align:right;margin-top:3px}
.cmp .c2 span{color:var(--dim2)}
.dbar{display:flex;height:5px;border-radius:99px;overflow:hidden;background:var(--line);margin-top:5px}
.dbar i{display:block;height:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <div class="brand">FORJA<span>.</span></div>
  <div class="sub" id="topsub">mapa de força</div>
</div></div>

<main class="wrap">

  <!-- ============ MAPA ============ -->
  <section class="view on" id="v-mapa"></section>

  <!-- ============ TREINO ============ -->
  <section class="view" id="v-treino"></section>

  <!-- ============ DUELO ============ -->
  <section class="view" id="v-duelo"></section>

  <!-- ============ FOCO ============ -->
  <section class="view" id="v-foco"></section>

  <!-- ============ HISTÓRICO ============ -->
  <section class="view" id="v-hist"></section>

  <!-- ============ DADOS ============ -->
  <section class="view" id="v-dados"></section>

</main>

<nav class="tabs"><div class="wrap">
  <button class="tab on" data-tab="mapa"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.6"/><path d="M6 10h12M12 9v6M7 21l2-6h6l2 6M6 10l-2 4M18 10l2 4"/></svg><b>Mapa</b></button>
  <button class="tab" data-tab="treino"><svg viewBox="0 0 24 24"><path d="M4 9v6M20 9v6M7 7v10M17 7v10M7 12h10"/></svg><b>Treino</b></button>
  <button class="tab" data-tab="duelo"><svg viewBox="0 0 24 24"><path d="M4 20l7-7M20 20l-7-7M6 4l5 5M18 4l-5 5M3.5 6.5l3-3 2.5 2.5-3 3zM20.5 6.5l-3-3L15 6l3 3z"/></svg><b>Duelo</b></button>
  <button class="tab" data-tab="foco"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="3.4"/><path d="M12 1.6v3M12 19.4v3M1.6 12h3M19.4 12h3"/></svg><b>Foco</b></button>
  <button class="tab" data-tab="hist"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg><b>Hist</b></button>
  <button class="tab" data-tab="dados"><svg viewBox="0 0 24 24"><path d="M12 3v13M7.5 11.5L12 16l4.5-4.5M4 20h16"/></svg><b>Dados</b></button>
</div></nav>

<div class="bd" id="bd"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetbody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ==================================================================
   FORJA — mapa de força · app de arquivo único
   Dados ficam no próprio aparelho (localStorage). Exporte para backup.
   ================================================================== */
const KEY='forja.v1';

/* ---------------- tiers ---------------- */
const TIERS=[
 {n:'Ferro',    c:'#6E7681'},
 {n:'Bronze',   c:'#C0763A'},
 {n:'Prata',    c:'#B9C4D0'},
 {n:'Ouro',     c:'#E8B23A'},
 {n:'Platina',  c:'#45D3C4'},
 {n:'Diamante', c:'#8FC0FF'}
];
const BAND=100/6, DIVW=BAND/3, ROM=['III','II','I'];
const NODATA='#242A32';

function tierOf(s){ return Math.max(0,Math.min(5,Math.floor(s/BAND))); }
function divOf(s){ const t=tierOf(s); return Math.max(0,Math.min(2,Math.floor((s-t*BAND)/DIVW))); }
function tierLabel(s){ if(s==null) return 'sem dados'; return TIERS[tierOf(s)].n+' '+ROM[divOf(s)]; }
function tierColor(s){ return s==null?NODATA:TIERS[tierOf(s)].c; }
function nextBound(s){ const t=tierOf(s), d=divOf(s); const b=t*BAND+(d+1)*DIVW; return b>99.99?null:b; }
function nextLabel(s){ const b=nextBound(s); return b==null?null:TIERS[tierOf(b+.001)].n+' '+ROM[divOf(b+.001)]; }

/* ---------------- músculos ---------------- */
const MUS=[
 {id:'peito',       n:'Peito',             imp:1.0},
 {id:'dorsais',     n:'Dorsais',           imp:1.1},
 {id:'trapezio',    n:'Trapézio',          imp:0.7},
 {id:'ombros',      n:'Ombros',            imp:0.9},
 {id:'ombros_post', n:'Ombro posterior',   imp:0.5},
 {id:'biceps',      n:'Bíceps',            imp:0.7},
 {id:'triceps',     n:'Tríceps',           imp:0.8},
 {id:'antebraco',   n:'Antebraço',         imp:0.5},
 {id:'abdomen',     n:'Abdômen',           imp:0.7},

    try{return localStorage.getItem(k)}catch(e){return null}
  },

  }
};

/* ---------------- motor ---------------- */
/* 1RM estimado: Brzycki até 12 reps, extensão achatada acima disso */
function mult(r){r=Math.max(1,Math.min(40,r));return r<=12?36/(37-r):1.44+(r-12)*0.022;}
/* carga que o app soma por conta própria: barra (se o usuário digita só as anilhas) + peso corporal */
function extra(ex,P){
  const b=(ex.bar&&P&&P.somar)?(P.barra||20)*ex.bar:0;
  return b+(ex.bw||0)*((P&&P.peso)||0);
}
function perf(p){return {peso:(p&&p.peso)||0,sexo:(p&&p.sexo)||'m',barra:(p&&p.barra)||20,somar:!!(p&&p.somar)};}
function e1rm(kg,reps,ex,P){return (kg+extra(ex,P))*mult(reps);}

/* limites ajustados ao sexo: o fator vale só para a carga acima do peso corporal */
function limites(ex,sexo){
  const bw=ex.bw||0, f=sexo==='f'?FFEM[ex.t]:1;
  return ex.p.map(t=>bw+(t-bw)*f);
}
/* razão (1RM/peso) -> pontuação 0..100 */
function pontos(ratio,L){
  if(ratio<=0) return 0;
  if(ratio<L[0]) return Math.max(0,BAND*(ratio/L[0]));
  for(let i=0;i<L.length-1;i++) if(ratio<L[i+1]) return BAND*(i+1)+BAND*(ratio-L[i])/(L[i+1]-L[i]);
  return Math.min(100,BAND*5+BAND*Math.min(1,(ratio-L[4])/(L[4]*.35)));
}
/* razão necessária para uma pontuação alvo (inverso de pontos) */
function razaoPara(alvo,L){
  const i=Math.floor(alvo/BAND), fr=(alvo-i*BAND)/BAND;
  if(i<=0) return L[0]*fr;
  if(i>=5) return L[4]*(1+.35*fr);
  return L[i-1]+(L[i]-L[i-1])*fr;
}

const JANELA=90;      // dias em que uma carga conta cheia
const JANELA_MAX=270; // depois disso a carga é ignorada

function vazio(peso,sexo){
  const mus={}; for(const m of MUS) mus[m.id]={score:null,conf:0,vol:0,ultima:null,contrib:[]};
  return {exs:{},mus,geral:null,cobertura:0,peso:peso||0,sexo:sexo||'m',P:perf({peso,sexo})};
}
/* motor: calcula um mapa completo para QUALQUER perfil/histórico.
   `ate` (ISO) permite reconstruir o mapa como ele era numa data passada. */
function motor(perfil,sessoes,ate){
  const P=perf(perfil), peso=P.peso, sexo=P.sexo;
  if(!peso||!sessoes) return vazio(peso,sexo);
  const ref=ate?new Date(ate+'T12:00:00').getTime():Date.now();
  const dd=iso=>Math.floor((ref-new Date(iso+'T12:00:00').getTime())/864e5);
  const best={}, vol={}, ultima={};
  for(const ses of sessoes){
    const d=dd(ses.data); if(d<0) continue;
    for(const st of ses.series){
      const ex=EXBY[st.ex]; if(!ex) continue;
      const v=e1rm(st.kg,st.reps,ex,P);
      if(d<=JANELA_MAX){
        const pen=d<=JANELA?1:0.92, cur=best[st.ex];
        if(!cur||v*pen>cur.v) best[st.ex]={v:v*pen,bruto:v,kg:st.kg,reps:st.reps,data:ses.data,velho:d>JANELA};
      }
      for(const mid in ex.m){
        if(d<=28) vol[mid]=(vol[mid]||0)+ex.m[mid];
        if(ex.m[mid]>=.4&&(!ultima[mid]||ses.data>ultima[mid])) ultima[mid]=ses.data;
      }
    }
  }
  const exs={};
  for(const id in best){
    const ex=EXBY[id], L=limites(ex,sexo), ratio=best[id].v/peso;
    exs[id]={...best[id],ratio,score:pontos(ratio,L),L};
  }
  const mus={};
  for(const m of MUS){
    let sw=0,swv=0,mx=0,mxp=0,contrib=[];
    for(const id in exs){
      const w=EXBY[id].m[m.id]; if(!w) continue;
      const s=exs[id].score;
      sw+=w; swv+=w*s; contrib.push({id,w,score:s,kg:exs[id].kg,reps:exs[id].reps,data:exs[id].data,velho:exs[id].velho});
      if(s>mx&&w>=.5) mx=s;
      if(s>mxp) mxp=s;
    }
    contrib.sort((a,b)=>b.w*b.score-a.w*a.score);
    if(!sw){mus[m.id]={score:null,conf:0,vol:vol[m.id]||0,ultima:ultima[m.id]||null,contrib:[]};continue;}
    mus[m.id]={score:Math.min(100,.6*(swv/sw)+.4*(mx||mxp)),conf:Math.min(1,sw/1.5),vol:vol[m.id]||0,ultima:ultima[m.id]||null,contrib};
  }
  let gw=0,gv=0;
  for(const m of MUS) if(mus[m.id].score!=null){const w=m.imp*(.5+.5*mus[m.id].conf);gw+=w;gv+=w*mus[m.id].score;}
  return {exs,mus,geral:gw?gv/gw:null,cobertura:MUS.filter(m=>mus[m.id].score!=null).length,peso,sexo,P};
}
function recalc(){ calc=motor(S.perfil,S.sessoes); return calc; }

/* metas: quanto falta para a próxima divisão em cada exercício */
function metas(c){
  c=c||calc;
  const out=[];
  for(const id in c.exs){
    const e=c.exs[id], ex=EXBY[id], alvo=nextBound(e.score);
    if(alvo==null) continue;
    const ratioNec=razaoPara(alvo,e.L), e1Nec=ratioNec*c.peso, xt=extra(ex,c.P);
    const kgNec=e1Nec/mult(e.reps)-xt;
    const cargaAtual=e.kg+xt;
    let repsNec=null;
    for(let r=e.reps+1;r<=30;r++) if(cargaAtual*mult(r)>=e1Nec){repsNec=r;break;}
    let pr=0;
    for(const mid in ex.m){const ms=c.mus[mid]; if(!ms)continue;
      const s=ms.score==null?0:ms.score;
      pr+=ex.m[mid]*(MUS.find(x=>x.id===mid).imp)*(1-s/100);}
    out.push({id,ex,score:e.score,alvo,alvoNome:nextLabel(e.score),kgNec:Math.max(0,kgNec),reps:e.reps,
      kgAtual:e.kg,repsNec,data:e.data,velho:e.velho,pr,
      prog:(e.score-(tierOf(e.score)*BAND+divOf(e.score)*DIVW))/DIVW});
  }
  out.sort((a,b)=>b.pr-a.pr);
  return out;
}
function sugestoes(mid,k=3){
  return EX.filter(e=>(e.m[mid]||0)>=.8).sort((a,b)=>b.m[mid]-a.m[mid]).slice(0,k);
}

function fillFor(mid){
  const d=calc&&calc.mus[mid];
  if(!d||d.score==null) return {f:NODATA,o:1};
  return {f:tierColor(d.score),o:.42+.58*d.conf};
}
function figGroup(v,cx,cf){
  const F=FIG[v]; let s='<g transform="translate('+cx+',12)">';
  for(const k in F.neutral){
    const p='<path d="'+F.neutral[k]+'" fill="#2A2F37" stroke="#0E1013" stroke-width="1.6"/>';
    s+=p; if(k.indexOf('@')>=0) s+='<g transform="scale(-1,1)">'+p+'</g>';
  }
  s+='<ellipse cx="0" cy="22" rx="16" ry="21" fill="#2A2F37" stroke="#0E1013" stroke-width="1.6"/>';
  for(let mir=0;mir<2;mir++){
    s+=mir?'<g transform="scale(-1,1)">':'<g>';
    for(const k in F.side){
      const mid=k.split('@')[0], c=cf(mid);
      s+='<path class="mz'+(cf===fillFor&&selMus===mid?' sel':'')+'" data-m="'+mid+'" d="'+F.side[k]+'" fill="'+c.f+'" fill-opacity="'+c.o+'" stroke="#0E1013" stroke-width="1.6"/>';
    }
    s+='</g>';
  }
  for(const p of F.det){
    const l='<path d="'+p+'" fill="none" stroke="#0E1013" stroke-width="1.2" opacity=".5" pointer-events="none"/>';
    s+=l+'<g transform="scale(-1,1)">'+l+'</g>';
  }
  return s+'</g>';
}
function bonecoSVG(cf,cls,alt){
  cf=cf||fillFor;
  return '<div class="figs '+(cls||'')+'"><svg viewBox="0 0 360 392" role="img" aria-label="'+(alt||'Mapa de força por músculo')+'">'
    +figGroup('front',90,cf)+figGroup('back',270,cf)+'</svg>'
    +'<div class="lbls"><span>FRENTE</span><span>COSTAS</span></div></div>';
}

/* ================= medidor ================= */
function gauge(score){
  const x0=4,x1=296,W=x1-x0;
  const px=v=>x0+W*Math.max(0,Math.min(100,v))/100;
  let s='<svg viewBox="0 0 300 30" style="width:100%;height:auto;display:block">';
  for(let i=0;i<6;i++){
    const a=px(i*BAND),b=px((i+1)*BAND);
    s+='<rect x="'+a+'" y="9" width="'+(b-a-1.2)+'" height="7" rx="1.5" fill="'+TIERS[i].c+'" opacity=".17"/>';
    if(score!=null&&score>i*BAND){
      const e=Math.min(b,px(score));
      if(e>a) s+='<rect x="'+a+'" y="9" width="'+Math.max(1,e-a-1.2)+'" height="7" rx="1.5" fill="'+TIERS[i].c+'"/>';
    }
    s+='<text x="'+((a+b)/2)+'" y="27" fill="#5D6673" font-family="IBM Plex Mono,monospace" font-size="7.5" letter-spacing=".6" text-anchor="middle">'+TIERS[i].n.slice(0,3).toUpperCase()+'</text>';
  }
  for(let i=1;i<6;i++) s+='<line x1="'+px(i*BAND)+'" y1="6" x2="'+px(i*BAND)+'" y2="19" stroke="#0E1013" stroke-width="1.4"/>';
  for(let i=0;i<18;i++){const x=px(i*(100/18)); if(i%3) s+='<line x1="'+x+'" y1="17.5" x2="'+x+'" y2="20" stroke="#343B45" stroke-width=".9"/>';}
  if(score!=null){
    const x=px(score);
    s+='<path d="M '+(x-3.4)+',3 L '+(x+3.4)+',3 L '+x+',7.6 Z" fill="#F4F6F9"/>';
    s+='<line x1="'+x+'" y1="7" x2="'+x+'" y2="18" stroke="#F4F6F9" stroke-width="1.5"/>';
  }
  return s+'</svg>';
}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  if(!id||!(kg>=0)||!(reps>0)){box.textContent='';return;}
  const ex=EXBY[id],e=e1rm(kg,reps,ex,calc.P),L=limites(ex,calc.sexo),p=pontos(e/calc.peso,L);
  const at=calc.exs[id];
  let t='1RM estimado <b class="mono">'+n0(e)+' kg</b> · '+tierLabel(p);

  box.innerHTML=t;
}

/* ---------- mapa de calor do exercício ---------- */
const HEAT=[
 {min:.85,c:'#FFC24A',n:'principal'},
 {min:.60,c:'#EE8127',n:'forte'},
 {min:.38,c:'#C4552F',n:'médio'},
 {min:.15,c:'#7E3B3C',n:'auxiliar'},
 {min:.001,c:'#4A3138',n:'leve'}
];
function heatColor(w){
  if(!w) return {f:'#20252C',o:1};
  for(const h of HEAT) if(w>=h.min) return {f:h.c,o:1};
  return {f:'#20252C',o:1};
}
function heatLabel(w){ for(const h of HEAT) if(w>=h.min) return h.n; return ''; }
function heatBox(exId){
  const ex=EXBY[exId]; if(!ex) return '';
  const cf=mid=>heatColor(ex.m[mid]||0);
  const lista=Object.keys(ex.m).sort((a,b)=>ex.m[b]-ex.m[a]);
  let li='';
  for(const mid of lista){
    const w=ex.m[mid],h=heatColor(w);
    li+='<div class="hrow"><span class="hn">'+MNAME[mid]+'</span>'
      +'<span class="hb"><i style="width:'+Math.round(w*100)+'%;background:'+h.f+'"></i></span>'
      +'<span class="hp mono">'+Math.round(w*100)+'</span></div>';
  }
  return '<div class="heat"><div class="hfig">'
    +'<svg viewBox="0 0 360 392" role="img" aria-label="Músculos recrutados por '+esc(ex.n)+'">'
    +figGroup('front',90,cf)+figGroup('back',270,cf)+'</svg></div>'
    +'<div class="hlist">'+li
    +'<div class="hleg">'+HEAT.slice(0,4).map(h=>'<span><i style="background:'+h.c+'"></i>'+h.n+'</span>').join('')+'</div>'
    +'</div></div>';
}

/* ---------- semanas, sequência e recordes ---------- */
const SEG0=Date.parse('2024-01-01T12:00:00'); // segunda-feira de referência
const semanaDe=iso=>Math.floor((new Date(iso+'T12:00:00').getTime()-SEG0)/6048e5);
function sequencia(sessoes){
  const wk=new Set(sessoes.map(s=>semanaDe(s.data)));
  const hoje=semanaDe(todayISO());
  let ini=wk.has(hoje)?hoje:(wk.has(hoje-1)?hoje-1:null);
  if(ini==null) return {n:0,aberta:false};
  let n=0,k=ini; while(wk.has(k)){n++;k--;}
  return {n,aberta:!wk.has(hoje)};
}
/* toda série que superou tudo o que veio antes naquele exercício */
function recordes(sessoes,P,janela){
  const ord=[...sessoes].sort((a,b)=>a.data<b.data?-1:1), topo={}, out=[];
  for(const s of ord) for(const st of s.series){
    const ex=EXBY[st.ex]; if(!ex) continue;
    const v=e1rm(st.kg,st.reps,ex,P);
    if(!topo[st.ex]||v>topo[st.ex]+.01){
      if(topo[st.ex]) out.push({ex:st.ex,data:s.data,kg:st.kg,reps:st.reps,de:topo[st.ex],para:v});
      topo[st.ex]=v;
    }
  }
  return janela?out.filter(r=>dias(r.data)<=janela):out;
}

/* ---------- evolução do índice, semana a semana ---------- */
function isoMenos(d){const t=new Date();t.setDate(t.getDate()-d);return new Date(t.getTime()-t.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
function evolucao(sem){
  sem=sem||12; const pts=[];
  for(let i=sem-1;i>=0;i--){
    const d=isoMenos(i*7);
    pts.push({d,v:motor(S.perfil,S.sessoes,d).geral});
  }
  return pts;
}
function projecao(pts){
  const v=pts.filter(p=>p.v!=null).slice(-8);
  if(v.length<3) return null;
  let sx=0,sy=0,sxy=0,sxx=0,n=v.length;
  v.forEach((p,i)=>{sx+=i;sy+=p.v;sxy+=i*p.v;sxx+=i*i;});
  const den=n*sxx-sx*sx; if(!den) return null;
  const slope=(n*sxy-sx*sy)/den;
  return {slope,semanas:v.length};
}
function sparkline(pts){
  const v=pts.map(p=>p.v);
  const val=v.filter(x=>x!=null); if(val.length<2) return '';
  const lo=Math.max(0,Math.min(...val)-4), hi=Math.min(100,Math.max(...val)+4);
  const W=300,H=76,x0=4,x1=296,y0=8,y1=60;
  const px=i=>x0+(x1-x0)*i/(pts.length-1);
  const py=x=>y1-(y1-y0)*(x-lo)/((hi-lo)||1);
  let s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">';
  for(let i=1;i<6;i++){const y=i*BAND; if(y>lo&&y<hi)
    s+='<line x1="'+x0+'" y1="'+py(y)+'" x2="'+x1+'" y2="'+py(y)+'" stroke="'+TIERS[i].c+'" stroke-width="1" opacity=".3" stroke-dasharray="2 4"/>'
      +'<text x="'+x1+'" y="'+(py(y)-3)+'" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="7" fill="'+TIERS[i].c+'" opacity=".8">'+TIERS[i].n.toUpperCase()+'</text>';}
  let d='',prev=null;
  pts.forEach((p,i)=>{ if(p.v==null){prev=null;return;} d+=(prev==null?'M ':'L ')+px(i)+','+py(p.v)+' '; prev=i; });
  s+='<path d="'+d+'" fill="none" stroke="#F4F6F9" stroke-width="2" stroke-linejoin="round"/>';
  const ult=pts.map((p,i)=>[i,p.v]).filter(a=>a[1]!=null).pop();
  if(ult) s+='<circle cx="'+px(ult[0])+'" cy="'+py(ult[1])+'" r="3.6" fill="'+tierColor(ult[1])+'" stroke="#0E1013" stroke-width="1.4"/>';
  s+='<text x="'+x0+'" y="'+(H-3)+'" font-family="IBM Plex Mono,monospace" font-size="8" fill="#5D6673">'+pts.length+' SEMANAS</text>';
  s+='<text x="'+x1+'" y="'+(H-3)+'" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="8" fill="#5D6673">HOJE</text>';
  return s+'</svg>';
}

/* ---------- selos ---------- */
function selos(c,sessoes){
  const R=id=>c.exs[id]?c.exs[id].ratio:0;
  const KG=id=>c.exs[id]?c.exs[id].bruto:0;
  const N=id=>c.mus[id].score;
  const notas=MUS.map(m=>c.mus[m.id].score).filter(x=>x!=null);
  const minN=notas.length?Math.min(...notas):0, maxN=notas.length?Math.max(...notas):0;
  const tri=KG('supino_reto')+KG('agacho')+KG('terra');
  const cheio=c.cobertura===MUS.length, sq=sequencia(sessoes).n;
  const cl=x=>Math.max(0,Math.min(1,x||0));
  const L=[
   {n:'Peso do corpo',       d:'Supino reto com 1× o peso corporal',            p:cl(R('supino_reto')/1)},
   {n:'Agacho dobrado',      d:'Agachamento livre com 2× o peso corporal',      p:cl(R('agacho')/2)},
   {n:'Terra 2,5×',          d:'Levantamento terra com 2,5× o peso corporal',   p:cl(R('terra')/2.5)},
   {n:'Barra lastrada',      d:'Barra fixa com +20 kg de carga extra',          p:cl((c.exs.barra_fixa?c.exs.barra_fixa.kg:0)/20)},
   {n:'Clube dos 400',       d:'Supino + agacho + terra somando 400 kg (1RM est.)', p:cl(tri/400)},
   {n:'Clube dos 500',       d:'Os mesmos três somando 500 kg',                 p:cl(tri/500)},
   {n:'Mapa completo',       d:'Os 15 músculos medidos pelo menos uma vez',     p:cl(c.cobertura/MUS.length)},
   {n:'Piso de Prata',       d:'Nenhum músculo abaixo de Prata',                p:cheio?cl(minN/(2*BAND)):cl(c.cobertura/MUS.length*.9)},
   {n:'Piso de Ouro',        d:'Nenhum músculo abaixo de Ouro',                 p:cheio?cl(minN/(3*BAND)):cl(c.cobertura/MUS.length*.7)},
   {n:'Sem elo fraco',       d:'Diferença de no máximo 15 pontos entre o mais forte e o mais fraco', p:cheio?cl(15/Math.max(15,maxN-minN)):cl(c.cobertura/MUS.length*.8)},
   {n:'Puxa o que empurra',  d:'Dorsais com nota igual ou maior que o peito',   p:(N('peito')&&N('dorsais'))?cl(N('dorsais')/N('peito')):0},
   {n:'Posterior à altura',  d:'Posterior de coxa com 85% da nota do quadríceps', p:(N('quadriceps')&&N('posterior'))?cl(N('posterior')/(0.85*N('quadriceps'))):0},
   {n:'10 semanas',          d:'10 semanas seguidas com pelo menos um treino',  p:cl(sq/10)},
   {n:'30 semanas',          d:'30 semanas seguidas sem furar',                 p:cl(sq/30)},
   {n:'100 treinos',         d:'100 treinos registrados',                       p:cl(sessoes.length/100)},
   {n:'Platina em campo',    d:'Qualquer músculo em Platina',                   p:cl(maxN/(4*BAND))},
   {n:'Diamante em campo',   d:'Qualquer músculo em Diamante',                  p:cl(maxN/(5*BAND))}
  ];
  return L.map(x=>({...x,ok:x.p>=1}));
}
function selosBox(c,sessoes){
  const L=selos(c,sessoes), ok=L.filter(x=>x.ok);
  const ord=[...ok,...L.filter(x=>!x.ok).sort((a,b)=>b.p-a.p)];
  let h='<div class="card"><div class="ttl">Selos · '+ok.length+' de '+L.length+'</div><div class="selos">';
  for(const s of ord){
    h+='<div class="selo'+(s.ok?' ok':'')+'"><b>'+s.n+'</b><s>'+s.d+'</s>'
      +(s.ok?'<span class="mono">conquistado</span>':'<span class="bar"><i style="width:'+Math.round(s.p*100)+'%"></i></span><span class="mono">'+Math.round(s.p*100)+'%</span>')
      +'</div>';
  }
  return h+'</div></div>';
}

/* ---------- rivais ---------- */
let rivalSel=null, rivalPend=null;
function ghosts(){
  const out=[];
  if(!S.sessoes.length) return out;
  const primeira=S.sessoes.map(s=>s.data).sort()[0];
  for(const d of [30,90,180]){
    const corte=isoMenos(d);
    if(primeira<=corte) out.push({id:'g'+d,nome:'Você, '+d+' dias atrás',ghost:d});
  }
  return out;
}
function rivalCalc(r){
  if(r.ghost) return motor(S.perfil,S.sessoes,isoMenos(r.ghost));
  return motor(r.perfil,r.sessoes);
}
const EU='#45D3C4', RIVAL='#E0664B';

function vDuelo(){
  const el=document.getElementById('v-duelo');
  if(!S.perfil){el.innerHTML=onboarding();return;}
  const lista=[...S.rivais,...ghosts()];
  let h='';
  if(!lista.length){
    h+='<div class="card"><div class="empty"><h3>Sem ninguém para duelar</h3>'
     +'<p>Peça a um parceiro de treino o backup .json dele (Dados › Baixar backup) e carregue aqui. Também dá para duelar com você mesmo depois de 30 dias de histórico.</p></div>'
     +addRivalBox()+'</div>';
    el.innerHTML=h; return;
  }
  if(!rivalSel||!lista.find(r=>r.id===rivalSel)) rivalSel=lista[0].id;
  const r=lista.find(x=>x.id===rivalSel);
  h+='<div class="chips">';
  for(const x of lista) h+='<button class="chip'+(x.id===rivalSel?' on':'')+'" data-rival="'+x.id+'">'+esc(x.nome)+'</button>';
  h+='</div>';

  const rc=rivalCalc(r), mc=calc;
  if(rc.geral==null||mc.geral==null){
    h+='<div class="card"><p class="hint">Ainda falta dado de um dos lados para comparar.</p></div>'+addRivalBox();
    el.innerHTML=h; return;
  }
  let meus=0,dele=0,emp=0;
  const linhas=[];
  for(const m of MUS){
    const a=mc.mus[m.id].score,b=rc.mus[m.id].score;
    if(a==null&&b==null) continue;
    const d=(a||0)-(b||0);
    if(Math.abs(d)<1.5) emp++; else if(d>0) meus++; else dele++;
    linhas.push({m,a,b,d});
  }
  linhas.sort((x,y)=>x.d-y.d);
  const ca=tierColor(mc.geral),cb=tierColor(rc.geral);
  h+='<div class="card"><div class="duel">'
   +'<div class="dl"><i style="background:'+EU+'"></i><s>Você</s><b class="mono">'+n1(mc.geral)+'</b><u style="color:'+ca+'">'+tierLabel(mc.geral)+'</u></div>'
   +'<div class="dvs">×</div>'
   +'<div class="dl r"><i style="background:'+RIVAL+'"></i><s>'+esc(r.nome)+'</s><b class="mono">'+n1(rc.geral)+'</b><u style="color:'+cb+'">'+tierLabel(rc.geral)+'</u></div>'
   +'</div>'
   +'<div class="placar"><span style="color:'+EU+'">'+meus+'</span> — <span style="color:'+RIVAL+'">'+dele+'</span>'
   +(emp?' <span class="mono" style="color:var(--dim2);font-size:11px">('+emp+' empate)</span>':'')+'</div>'
   +'<p class="hint" style="text-align:center">músculos em que cada um lidera</p></div>';

  h+=bonecoSVG(mid=>{
    const a=mc.mus[mid].score,b=rc.mus[mid].score;
    if(a==null&&b==null) return {f:NODATA,o:1};
    const d=(a||0)-(b||0);
    if(Math.abs(d)<1.5) return {f:'#4A525E',o:.9};
    return {f:d>0?EU:RIVAL,o:.32+.68*Math.min(1,Math.abs(d)/14)};
  },'','Comparação de força por músculo');
  h+='<p class="hint" style="margin:-4px 0 12px">Ciano = você lidera, laranja = '+esc(r.nome.split(',')[0])+'. Quanto mais forte a cor, maior a diferença.</p>';

  h+='<div class="card"><div class="ttl">Músculo a músculo</div>';
  for(const l of linhas){
    const a=l.a==null?0:l.a, b=l.b==null?0:l.b, tot=a+b||1;
    h+='<div class="cmp"><div class="c1"><b>'+l.m.n+'</b>'
      +'<span class="mono" style="color:'+(l.d>1.5?EU:(l.d<-1.5?RIVAL:'var(--dim)'))+'">'
      +(l.d>0?'+':'')+n1(l.d)+'</span></div>'
      +'<div class="dbar"><i style="width:'+(a/tot*100)+'%;background:'+EU+'"></i><i style="width:'+(b/tot*100)+'%;background:'+RIVAL+'"></i></div>'
      +'<div class="c2 mono">'+(l.a==null?'—':n1(l.a))+' <span>vs</span> '+(l.b==null?'—':n1(l.b))+'</div></div>';
  }
  h+='</div>';

  const comuns=Object.keys(mc.exs).filter(id=>rc.exs[id]);
  if(comuns.length){
    comuns.sort((x,y)=>(rc.exs[y].ratio-mc.exs[y].ratio)-(rc.exs[x].ratio-mc.exs[x].ratio));
    h+='<div class="card"><div class="ttl">Exercícios em comum</div>'
     +'<p class="hint">Carga bruta e, entre parênteses, quantas vezes o próprio peso corporal — é a comparação justa entre corpos diferentes.</p>';
    for(const id of comuns){
      const a=mc.exs[id],b=rc.exs[id],venc=a.ratio>=b.ratio;

       +'<span class="mono" style="color:'+(venc?EU:RIVAL)+'">'+(venc?'você':'ele/ela')+'</span></div>'
       +'<div class="c2 mono" style="text-align:left">'
       +'<span style="color:'+EU+'">'+n0(a.bruto)+' kg ('+n2(a.ratio)+'×)</span> · '
       +'<span style="color:'+RIVAL+'">'+n0(b.bruto)+' kg ('+n2(b.ratio)+'×)</span></div></div>';
    }
    h+='</div>';
  }
  const so=Object.keys(rc.exs).filter(id=>!mc.exs[id]);
  if(so.length) h+='<div class="card"><div class="ttl">Só '+esc(r.nome.split(',')[0])+' faz</div><p class="hint">'+so.map(id=>esc(EXBY[id].n)).join(' · ')+'</p></div>';

  h+=addRivalBox(r);

/* ---------- caixa de evolução (Mapa) ---------- */
function evolucaoBox(){
  const pts=evolucao(12), pr=recordes(S.sessoes,calc.P,30), sq=sequencia(S.sessoes);
  const spark=sparkline(pts);
  const pj=projecao(pts), nb=calc.geral!=null?nextBound(calc.geral):null;
  let h='<div class="card"><div class="ttl">Evolução</div>';
  if(spark) h+=spark; else h+='<p class="hint">Duas semanas de registro e a curva aparece aqui.</p>';
  h+='<div class="stats">'
   +'<div><b class="mono">'+sq.n+'</b><s>semana'+(sq.n===1?'':'s')+' seguida'+(sq.n===1?'':'s')+'</s></div>'
   +'<div><b class="mono">'+pr.length+'</b><s>recordes em 30d</s></div>'
   +'<div><b class="mono">'+S.sessoes.length+'</b><s>treinos</s></div></div>';
  if(pj&&nb!=null){
    if(pj.slope>=0.08){
      const sem=Math.ceil((nb-calc.geral)/pj.slope);
      h+='<p class="hint mt">No ritmo das últimas '+pj.semanas+' semanas (<b>+'+n1(pj.slope)+' pt/semana</b>), '
        +nextLabel(calc.geral)+' em <b>~'+sem+' semana'+(sem===1?'':'s')+'</b>.</p>';
    }else if(pj.slope>-0.08){
      h+='<p class="hint mt">Índice praticamente parado nas últimas '+pj.semanas+' semanas. Veja em <b>Foco</b> qual carga subir para destravar.</p>';
    }else{
      h+='<p class="hint mt" style="color:var(--warn)">Índice caindo ('+n1(pj.slope)+' pt/semana). Recordes antigos perdem valor — refaça as cargas principais.</p>';
    }
  }
  if(sq.aberta&&sq.n) h+='<p class="hint">Semana atual ainda em aberto — um treino mantém a sequência de '+sq.n+'.</p>';
  if(pr.length){
    h+='<div class="ttl" style="margin:14px 0 6px">Recordes recentes</div>';
    for(const r of pr.slice(-4).reverse())
      h+='<div class="prline"><b>'+esc(EXBY[r.ex].n)+'</b><s class="mono">'+n1(r.kg)+' kg × '+r.reps
        +' · '+n0(r.de)+'→'+n0(r.para)+' kg · '+fmtDate(r.data)+'</s></div>';
  }
  return h+'</div>';
}

/* ================= navegação ================= */
let tab='mapa';
const RENDER={mapa:vMapa,treino:vTreino,duelo:vDuelo,foco:vFoco,hist:vHist,dados:vDados};
const SUB={mapa:'mapa de força',treino:'registrar treino',duelo:'comparar com rivais',foco:'onde apertar',hist:'histórico',dados:'perfil e exportação'};
function go(t){
  tab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t));
  document.getElementById('topsub').textContent=SUB[t];
  RENDER[t]();
  window.scrollTo({top:0,behavior:'instant'});
}
function refresh(){recalc();RENDER[tab]();}
let tmr=null;
function toast(msg,ms){
  const el=document.getElementById('toast');
  el.innerHTML=msg; el.classList.add('on');
  clearTimeout(tmr); tmr=setTimeout(()=>el.classList.remove('on'),ms||2600);
}

/* ================= eventos ================= */
document.addEventListener('click',async ev=>{
  const t=ev.target;

  const tb=t.closest('.tab'); if(tb) return go(tb.dataset.tab);
  const gg=t.closest('[data-go]'); if(gg) {fecharSheet(); return go(gg.dataset.go);}

  if(t.id==='bd') return fecharSheet();

  const mz=t.closest('[data-m]');
  if(mz&&calc){ return abrirMus(mz.dataset.m); }

  const q=t.closest('[data-quick]');
  if(q){ const s=document.getElementById('f-ex'); s.value=q.dataset.quick; previa();
    document.querySelectorAll('[data-quick]').forEach(c=>c.classList.toggle('on',c===q)); return; }

  const st=t.closest('[data-stp]');
  if(st){
    const [f,dv]=st.dataset.stp.split(','), inp=document.getElementById('f-'+f);
    let v=num(inp.value); if(isNaN(v)) v=0;
    v=Math.max(0,v+parseFloat(dv));
    inp.value=f==='kg'?n1(v):String(Math.round(v));
    previa(); return;
  }

  if(t.id==='add'||t.id==='rep'){
    if(t.id==='rep'){
      const last=draft.series[draft.series.length-1]||(S.sessoes.length?S.sessoes[S.sessoes.length-1].series.slice(-1)[0]:null);
      if(!last) return toast('Nada para repetir');
      document.getElementById('f-ex').value=last.ex;
      document.getElementById('f-kg').value=n1(last.kg);
      document.getElementById('f-reps').value=last.reps;
      return previa();
    }
    const id=document.getElementById('f-ex').value, kg=num(document.getElementById('f-kg').value), reps=parseInt(document.getElementById('f-reps').value,10);
    if(!(kg>=0)) return toast('Informe a carga');
    if(!(reps>0)) return toast('Informe as repetições');
    if(reps>40) return toast('Máximo de 40 repetições');
    draft.data=document.getElementById('f-data').value||todayISO();
    draft.series.push({ex:id,kg,reps});
    draft.ex=id; draft.kg=n1(kg); draft.reps=reps;
    vTreino(); return;
  }

  const dl=t.closest('[data-del]');
  if(dl){ draft.series.splice(+dl.dataset.del,1); return vTreino(); }

  if(t.id==='salvar'){
    if(!draft.series.length) return;
    const antes=snapshot();
    S.sessoes.push({id:Date.now().toString(36),data:draft.data,notas:(document.getElementById('f-notas')||{}).value||'',series:draft.series});
    await save();
    draft={data:todayISO(),series:[],notas:''};
    recalc();
    const ups=compara(antes,snapshot());
    go('mapa');
    toast(ups.length?ups.slice(0,2).join(' · '):'Treino salvo',ups.length?4200:2200);
    return;
  }

  const ds=t.closest('[data-dels]');
  if(ds){
    if(!confirm('Excluir este treino?')) return;
    S.sessoes=S.sessoes.filter(s=>s.id!==ds.dataset.dels);
    await save(); refresh(); return toast('Treino excluído');
  }

  if(t.id==='o-ok'||t.id==='p-salvar'){
    const pre=t.id==='o-ok'?'o':'p';
    const peso=num(document.getElementById(pre+'-peso').value);
    if(!(peso>=25&&peso<=350)) return toast('Peso corporal inválido');
    S.perfil={peso,sexo:document.getElementById(pre+'-sexo').value,
      somar:pre==='p'?document.getElementById('p-somar').value==='1':false,
      barra:pre==='p'?(num((document.getElementById('p-barra')||{}).value)||20):20};
    if(!(S.perfil.barra>=1&&S.perfil.barra<=40)) S.perfil.barra=20;
    await save(); recalc();
    if(pre==='o'){go('mapa');toast('Pronto — pode registrar seu treino');}
    else {RENDER[tab]();toast('Perfil salvo');}
    return;
  }

  const rv=t.closest('[data-rival]');
  if(rv){ rivalSel=rv.dataset.rival; return vDuelo(); }

  if(t.id==='rv-x'){ rivalPend=null; return vDuelo(); }
  if(t.id==='rv-ok'){
    const nome=(document.getElementById('rv-nome').value||'').trim();
    if(!nome) return toast('Dê um nome ao rival');
    let perfil=rivalPend.perfil&&rivalPend.perfil.peso>0?rivalPend.perfil:null;
    if(!perfil){
      const pe=num((document.getElementById('rv-peso')||{}).value);
      if(!(pe>=25&&pe<=350)) return toast('Peso corporal do rival inválido');
      perfil={peso:pe,sexo:document.getElementById('rv-sexo').value};
    }
    const ex=S.rivais.find(x=>x.nome.toLowerCase()===nome.toLowerCase());
    const obj={id:ex?ex.id:'r'+Date.now().toString(36),nome,perfil,sessoes:rivalPend.sessoes,em:todayISO()};
    if(ex) S.rivais[S.rivais.indexOf(ex)]=obj; else S.rivais.push(obj);
    rivalPend=null; rivalSel=obj.id; await save(); vDuelo();
    return toast(ex?'Rival atualizado':'Rival adicionado');
  }
  const dr=t.closest('[data-delr]');
  if(dr){
    if(!confirm('Remover este rival?')) return;
    S.rivais=S.rivais.filter(x=>x.id!==dr.dataset.delr);
    if(rivalSel===dr.dataset.delr) rivalSel=null;
    await save(); vDuelo(); return toast('Rival removido');
  }

  if(t.id==='x-rel-copy'){
    const txt=relatorio();
    try{ await navigator.clipboard.writeText(txt); toast('Relatório copiado'); }
    catch(e){
      const ta=document.createElement('textarea'); ta.value=txt;
      ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
      try{document.execCommand('copy');toast('Relatório copiado');}catch(_){toast('Não deu para copiar — baixe o .md');}
      ta.remove();
    } return;
  }
  if(t.id==='x-rel-md') return baixar('forja-relatorio-'+todayISO()+'.md',relatorio(),'text/markdown');
  if(t.id==='x-csv')    return baixar('forja-series-'+todayISO()+'.csv','\uFEFF'+csv(),'text/csv');
  if(t.id==='x-json')   return baixar('forja-backup-'+todayISO()+'.json',JSON.stringify({v:1,perfil:S.perfil,sessoes:S.sessoes},null,1),'application/json');

  if(t.id==='wipe'){
    if(!confirm('Apagar perfil e todos os treinos? Não tem como desfazer.')) return;
    S={perfil:null,sessoes:[]}; await save(); recalc(); go('mapa'); return toast('Tudo apagado');
  }
});
document.addEventListener('input',ev=>{
  if(['f-kg','f-reps','f-ex'].includes(ev.target.id)) previa();
  if(ev.target.id==='f-data') draft.data=ev.target.value;
  if(ev.target.id==='f-notas') draft.notas=ev.target.value;
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='p-somar'){
    const w=document.getElementById('p-barrawrap');
    if(w) w.style.display=ev.target.value==='1'?'':'none';
  }
});
document.addEventListener('change',async ev=>{
  if(ev.target.id==='imp-rival'){
    const f=ev.target.files[0]; ev.target.value='';
    if(!f) return;
    try{
      const o=JSON.parse(await f.text());
      const ss=(o.sessoes||[]).filter(s=>s&&Array.isArray(s.series)).map(s=>({id:s.id,data:s.data,notas:s.notas||'',
        series:s.series.filter(x=>EXBY[x.ex]).map(x=>({ex:x.ex,kg:num(x.kg),reps:parseInt(x.reps,10)}))})).filter(s=>s.series.length);
      if(!ss.length) throw 0;
      rivalPend={perfil:o.perfil||null,sessoes:ss};
      go('duelo');
      toast('Arquivo lido — dê um nome');
    }catch(e){ toast('Arquivo inválido ou sem treinos'); }
    return;
  }
  if(ev.target.id!=='imp') return;
  const f=ev.target.files[0]; if(!f) return;
  try{
    const o=JSON.parse(await f.text());
    if(!o||!Array.isArray(o.sessoes)) throw 0;
    const sig=s=>s.data+'|'+s.series.map(x=>x.ex+x.kg+'x'+x.reps).join(',');
    const have=new Set(S.sessoes.map(sig)), ids=new Set(S.sessoes.map(s=>s.id));
    let add=0;
    for(const s of o.sessoes){
      if(!s.series||ids.has(s.id)||have.has(sig(s))) continue;
      S.sessoes.push({id:s.id||Date.now().toString(36)+add,data:s.data,notas:s.notas||'',
        series:s.series.filter(x=>EXBY[x.ex]).map(x=>({ex:x.ex,kg:num(x.kg),reps:parseInt(x.reps,10)}))});
      add++;
    }
    if(!S.perfil&&o.perfil) S.perfil=o.perfil;
    await save(); refresh(); toast(add+' treino(s) importado(s)');
  }catch(e){ toast('Arquivo inválido'); }
  ev.target.value='';
});

/* ================= subiu de nível? ================= */
function snapshot(){
  const o={geral:calc&&calc.geral!=null?tierLabel(calc.geral):null,m:{}};
  if(calc) for(const m of MUS) o.m[m.id]=calc.mus[m.id].score==null?null:tierLabel(calc.mus[m.id].score);
  return o;
}
function compara(a,b){
  const out=[];
  if(b.geral&&b.geral!==a.geral) out.push('GERAL → '+b.geral.toUpperCase());
  for(const m of MUS){
    const x=a.m[m.id],y=b.m[m.id];
    if(y&&y!==x) out.push(m.n.toUpperCase()+' → '+y.toUpperCase());
  }
  return out;
}

/* ================= exportação ================= */
function baixar(nome,txt,mime){
  const b=new Blob([txt],{type:mime+';charset=utf-8'}), u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=nome; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500); toast('Arquivo gerado');
}
function csv(){
  const L=['data;exercicio;grupo;carga_kg;reps;rm1_estimado_kg'];
  for(const s of [...S.sessoes].sort((a,b)=>a.data<b.data?-1:1))
    for(const x of s.series){
      const ex=EXBY[x.ex]; if(!ex) continue;
      L.push([s.data,ex.n,ex.g,n1(x.kg),x.reps,n1(e1rm(x.kg,x.reps,ex,calc.P))].join(';'));
    }
  return L.join('\n');
}
function relatorio(){
  const g=calc.geral, L=[];
  L.push('# FORJA — relatório de força');
  L.push('');
  L.push('- Gerado em: '+fmtDate(todayISO()));
  L.push('- Peso corporal: '+n1(calc.peso)+' kg · tabela de referência '+(calc.sexo==='f'?'feminina':'masculina'));
  L.push('- Cargas digitadas: '+(calc.P.somar?'só as anilhas, com '+n1(calc.P.barra)+' kg de barra somados pelo app':'carga total, já com a barra'));
  L.push('- Índice geral: '+(g==null?'sem dados':n1(g)+'/100 — '+tierLabel(g)));
  L.push('- Músculos medidos: '+calc.cobertura+' de '+MUS.length);
  L.push('- Treinos registrados: '+S.sessoes.length+(S.sessoes.length?' (de '+fmtDate(S.sessoes.map(s=>s.data).sort()[0])+' a '+fmtDate(S.sessoes.map(s=>s.data).sort().slice(-1)[0])+')':''));
  L.push('');
  L.push('## Mapa por músculo');
  L.push('');
  L.push('| Músculo | Tier | Nota /100 | Confiança | Séries efetivas/sem (4 sem) | Último estímulo direto |');
  L.push('|---|---|---|---|---|---|');
  for(const m of MUS.slice().sort((a,b)=>{
    const x=calc.mus[a.id].score,y=calc.mus[b.id].score;
    if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1; return x-y;})){
    const d=calc.mus[m.id];
    L.push('| '+m.n+' | '+(d.score==null?'sem dados':tierLabel(d.score))+' | '+(d.score==null?'—':n1(d.score))
      +' | '+n0(d.conf*100)+'% | '+n1(d.vol/4)+' | '+(d.ultima?fmtDate(d.ultima)+' ('+dias(d.ultima)+'d)':'nunca')+' |');
  }
  L.push('');
  L.push('## Recordes atuais (melhor série válida por exercício)');
  L.push('');
  L.push('| Exercício | Melhor série | 1RM estimado | 1RM / peso | Tier | Data |');
  L.push('|---|---|---|---|---|---|');
  const ids=Object.keys(calc.exs).sort((a,b)=>calc.exs[b].score-calc.exs[a].score);
  for(const id of ids){
    const e=calc.exs[id];
    L.push('| '+EXBY[id].n+' | '+n1(e.kg)+' kg × '+e.reps+' | '+n0(e.bruto)+' kg | '+n1(e.ratio)+'× | '+tierLabel(e.score)+' | '+fmtDate(e.data)+(e.velho?' (fora da janela de 90d)':'')+' |');
  }
  L.push('');
  const mt=metas().slice(0,6);
  if(mt.length){
    L.push('## Metas calculadas (próxima divisão, mesmas repetições)');
    L.push('');
    for(const x of mt) L.push('- '+x.ex.n+': '+n1(x.kgAtual)+' kg × '+x.reps+' → '+n1(Math.ceil(x.kgNec*2)/2)+' kg × '+x.reps+' para '+x.alvoNome);
    L.push('');
  }
  const sq=sequencia(S.sessoes), prs=recordes(S.sessoes,calc.P,60), ev=evolucao(10);
  L.push('## Ritmo');
  L.push('');
  L.push('- Sequência atual: '+sq.n+' semana(s) seguidas com treino'+(sq.aberta?' (semana atual ainda sem treino)':''));
  L.push('- Recordes nos últimos 60 dias: '+prs.length);
  const evv=ev.filter(p=>p.v!=null);
  if(evv.length>1) L.push('- Índice geral semana a semana (10 semanas): '+evv.map(p=>n1(p.v)).join(' → '));
  const pj=projecao(ev);
  if(pj) L.push('- Tendência: '+(pj.slope>0?'+':'')+n1(pj.slope)+' ponto por semana nas últimas '+pj.semanas+' semanas');
  L.push('');
  if(prs.length){
    L.push('### Recordes recentes');
    L.push('');
    for(const r of prs.slice(-8).reverse()) L.push('- '+fmtDate(r.data)+' — '+EXBY[r.ex].n+': '+n1(r.kg)+' kg × '+r.reps+' (1RM '+n0(r.de)+' → '+n0(r.para)+' kg)');
    L.push('');
  }
  L.push('## Treinos (últimos 15)');
  L.push('');
  for(const s of [...S.sessoes].sort((a,b)=>b.data<a.data?-1:1).slice(0,15)){
    L.push('- **'+fmtDate(s.data)+'** — '+s.series.map(x=>(EXBY[x.ex]?EXBY[x.ex].n:x.ex)+' '+n1(x.kg)+'×'+x.reps).join('; ')+(s.notas?' _('+s.notas+')_':''));
  }
  L.push('');
  L.push('## O que eu quero saber');
  L.push('');
  L.push('Com base nesses dados: quais músculos estão atrasados em relação ao resto, quais desequilíbrios entre agonista e antagonista aparecem (peito/costas, quadríceps/posterior, ombro anterior/posterior), onde o volume está baixo demais para a nota subir, e o que eu deveria priorizar nas próximas semanas.');
  L.push('');
  L.push('_Notas de 0 a 100 derivadas de 1RM estimado dividido pelo peso corporal, comparado a faixas de força relativa por exercício. Confiança baixa = poucos exercícios medindo aquele músculo._');
  return L.join('\n');
}
